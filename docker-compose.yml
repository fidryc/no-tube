services:
  api:
    build: ./backend
    container_name: fastapi_app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-docker/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis

    command: redis-server --requirepass ${REDIS_PASS}

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASS}",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq

    hostname: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "check_running"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
  taskiq_worker:
    build: ./backend
    container_name: taskiq_worker

    command:
      [
        "taskiq",
        "worker",
        "app.tasks.broker:broker",
        "app.tasks.tasks",
      ]

    depends_on:
      rabbitmq:
        condition: service_healthy

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env.prod



  taskiq_scheduler:
    build: ./backend
    container_name: taskiq_scheduler

    command:
      [
        "taskiq",
        "scheduler",
        "app.tasks.scheduler:scheduler",
        "app.tasks.tasks"
      ]

    depends_on:
      rabbitmq:
        condition: service_healthy

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env.prod

  video_worker:
    build:
      context: ./video-processing-worker

    container_name: video_worker

    depends_on:
      rabbitmq:
        condition: service_healthy

      postgres:
        condition: service_healthy

    restart: unless-stopped

    volumes:
      - ./video-processing-worker/config/prod.docker.yaml:/app/config/prod.docker.yaml:ro

    environment:
      CONFIG_PATH: /app/config/prod.docker.yaml

  api_proxy:
    build:
      context: ./video-processing-worker
      dockerfile: Dockerfile.proxy

    container_name: api_proxy

    depends_on:
      rabbitmq:
        condition: service_healthy

      postgres:
        condition: service_healthy

    restart: unless-stopped
    ports:
      - "8001:8001"

    volumes:
      - ./video-processing-worker/config/prod.docker.yaml:/app/config/prod.docker.yaml:ro

    environment:
      CONFIG_PATH: /app/config/prod.docker.yaml

  frontend:
    build:
      context: ./frontend/no-tube

    container_name: frontend

    depends_on:
      - api

    ports:
      - "5173:5173"

    volumes:
      - ./frontend/no-tube:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: true

    command: npm run dev -- --host 0.0.0.0

volumes:
  pg_data:
  rabbitmq_data:
  redis_data: